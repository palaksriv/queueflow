<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queueflow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#070d2b;--ink:#0e1848;--blue:#2e6bff;--sky:#6db3ff;--orange:#ff8a1f;--pink:#ff2e93;--txt:#eef2ff;--mut:#97a3d6;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--grad:linear-gradient(120deg,var(--pink),var(--orange))}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 'DM Sans',system-ui,sans-serif;color:var(--txt);background:var(--navy);min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:560px;height:560px;border-radius:50%;filter:blur(120px);z-index:-1}
body:before{background:var(--blue);top:-180px;left:-140px;opacity:.55}
body:after{background:var(--pink);bottom:-220px;right:-140px;opacity:.38}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
button,input{font:inherit;color:inherit}
.mut{color:var(--mut)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
input{background:rgba(255,255,255,.07);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;width:100%}
input::placeholder{color:#7783b8}
input:focus{border-color:var(--sky);outline:none;background:rgba(109,179,255,.1)}
.btn{background:var(--grad);border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;color:#fff;box-shadow:0 8px 24px -8px rgba(255,46,147,.7);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none;box-shadow:none}
.btn.blue{background:linear-gradient(120deg,var(--blue),var(--sky));box-shadow:0 8px 24px -8px rgba(46,107,255,.8)}
.btn.sm{padding:8px 14px;border-radius:10px}
.ico{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--glass);cursor:pointer;font-size:14px;transition:.15s}
.ico:hover{border-color:var(--sky);background:rgba(109,179,255,.18)}
.ico.x:hover{border-color:var(--pink);background:rgba(255,46,147,.22)}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:40px;padding:5vw}
.hero h1{font-size:clamp(46px,7.4vw,104px);line-height:.92;font-weight:800}
.hero h1 span{display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:420px;margin-top:22px;color:var(--mut);font-size:17px}
.stubs{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.stub{padding:12px 20px;border-radius:14px;font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;border:2px dashed var(--line);background:var(--glass);transform:rotate(var(--r))}
.stub:nth-child(1){--r:-4deg;color:var(--sky)}.stub:nth-child(2){--r:3deg;color:var(--orange)}.stub:nth-child(3){--r:-2deg;color:var(--pink)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:34px;backdrop-filter:blur(18px)}
.card h2{font-size:30px;margin-bottom:6px}
.card form{display:grid;gap:12px;margin-top:20px}
.swap{background:none;border:0;color:var(--sky);cursor:pointer;margin-top:16px;text-decoration:underline}

/* app shell */
.shell{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{padding:26px 20px;background:rgba(7,13,43,.6);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{font-family:'Bricolage Grotesque';font-weight:800;font-size:28px}
.brand i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#nq{display:flex;gap:8px}#nq .btn{padding:0 16px;font-size:20px}
#ql{flex:1;overflow:auto;display:grid;gap:8px;align-content:start}
.qi{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1.5px solid transparent;cursor:pointer;background:var(--glass)}
.qi:hover{border-color:var(--line)}
.qi.on{border-color:var(--blue);background:linear-gradient(120deg,rgba(46,107,255,.35),rgba(109,179,255,.1))}
.qi b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{min-width:28px;text-align:center;padding:1px 9px;border-radius:99px;background:var(--grad);font-weight:700;font-size:13px}
.qi .del{background:none;border:0;color:var(--mut);cursor:pointer;opacity:0;font-size:16px}.qi:hover .del{opacity:1}
.me{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--mut);font-size:14px}
.me button{background:none;border:1px solid var(--line);border-radius:10px;padding:5px 12px;cursor:pointer;color:var(--txt)}
main{padding:34px clamp(18px,4vw,56px);max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:16px}
.head h1{font-size:clamp(34px,5vw,58px);line-height:1;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--glass);border:1px solid var(--line);padding:5px;border-radius:16px}
.tabs button{border:0;background:none;padding:9px 20px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--mut)}
.tabs button.on{background:linear-gradient(120deg,var(--blue),var(--sky));color:#fff}
.empty{text-align:center;padding:70px 20px;color:var(--mut)}
.empty h2{color:var(--txt);font-size:34px;margin-bottom:8px}

/* queue view */
#addf{display:flex;gap:10px;margin:26px 0 22px}
.now{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:26px 30px;border-radius:28px;background:linear-gradient(125deg,#1c3fd0 0%,#2e6bff 45%,#7a4dff 100%);position:relative;overflow:hidden;box-shadow:0 24px 60px -24px rgba(46,107,255,.9)}
.now:after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:var(--grad);opacity:.5;filter:blur(30px)}
.now>*{position:relative;z-index:1}
.srv{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.srv b{font-size:clamp(46px,7vw,84px);line-height:1;font-weight:800}
.srv span{font-size:20px;font-weight:500}
.now .lbl{opacity:.8;font-size:14px}
.big{padding:20px 30px;font-size:18px;display:grid;justify-items:center;line-height:1.2;min-width:190px}
.big small{font-weight:500;opacity:.85}
.kpis{display:flex;gap:26px;flex-wrap:wrap;margin:26px 0 8px;color:var(--mut)}
.kpis b{display:block;font-family:'Bricolage Grotesque';font-size:30px;color:var(--txt)}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 14px}.sec h3{font-size:22px}
.tk{display:grid;grid-template-columns:118px 1fr auto;align-items:center;margin-bottom:12px;border-radius:20px;background:var(--glass);border:1px solid var(--line);position:relative;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateX(-14px)}}
.tk .code{padding:18px 8px;text-align:center;font-size:30px;font-weight:800;border-right:2px dashed var(--line);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tk:before,.tk:after{content:"";position:absolute;left:107px;width:22px;height:22px;border-radius:50%;background:var(--navy);border:1px solid var(--line)}
.tk:before{top:-12px}.tk:after{bottom:-12px}
.tk:first-of-type{border-color:rgba(255,138,31,.65);box-shadow:0 0 0 4px rgba(255,138,31,.1)}
.tk .who{padding:0 20px;min-width:0}.tk .who b{display:block;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.tk .who span{color:var(--mut);font-size:14px}
.tk .act{display:flex;gap:8px;padding:0 18px}

/* analytics */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:26px 0}
.k{padding:20px;border-radius:20px;border:1px solid var(--line);background:var(--glass)}
.k:nth-child(1){background:linear-gradient(140deg,rgba(255,46,147,.4),rgba(255,138,31,.2))}
.k:nth-child(2){background:linear-gradient(140deg,rgba(46,107,255,.45),rgba(109,179,255,.15))}
.k small{color:var(--mut)}.k b{display:block;font:800 34px 'Bricolage Grotesque';margin-top:4px}
.chart{padding:24px;border-radius:24px;border:1px solid var(--line);background:var(--glass);margin-bottom:18px}
.chart h3{font-size:22px}.chart p.mut{margin:2px 0 14px}
svg{width:100%;height:auto;display:block;overflow:visible}svg text{fill:var(--mut);font:12px 'DM Sans'}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--pink);padding:12px 22px;border-radius:14px;font-weight:700;z-index:9;box-shadow:0 12px 30px -8px rgba(255,46,147,.8);animation:in .3s}
@media(max-width:860px){.auth{grid-template-columns:1fr}.shell{grid-template-columns:1fr}aside{position:static;height:auto}#ql{max-height:200px}.tk{grid-template-columns:96px 1fr}.tk .act{grid-column:1/3;padding:0 16px 14px}.tk:before,.tk:after{left:85px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,m='GET',b){
  const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||'Something went wrong');e.status=r.status;throw e}
  return j;
}
const S={user:null,queues:[],qid:null,data:null,an:null,tab:'queue',mode:'login',off:0};
const fmt=s=>{if(s==null||isNaN(s))return '–';s=Math.max(0,Math.round(s));
  if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s';
  return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---------- auth ---------- */
function renderAuth(){
  const reg=S.mode=='register';
  $('#app').innerHTML=`<div class="auth"><div class="hero">
    <h1>Calm lines.<span>Happy people.</span></h1>
    <p>Create a queue, hand out tokens, call the next person with one click, and see exactly where the time goes.</p>
    <div class="stubs"><div class="stub">A001</div><div class="stub">A002</div><div class="stub">A003</div></div></div>
    <div class="card"><h2>${reg?'Create your account':'Welcome back'}</h2>
    <p class="mut">${reg?'Start managing queues in a minute.':'Log in to manage your queues.'}</p>
    <form id="af">${reg?'<input id="an" placeholder="Your name" autocomplete="name" required>':''}
    <input id="ae" type="email" placeholder="Email" autocomplete="email" required>
    <input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="${reg?'new-password':'current-password'}" required>
    <button class="btn">${reg?'Create account':'Log in'}</button></form>
    <button class="swap" id="sw">${reg?'I already have an account':'New here? Create an account'}</button></div></div>`;
  $('#sw').onclick=()=>{S.mode=reg?'login':'register';renderAuth()};
  $('#af').onsubmit=async e=>{e.preventDefault();
    try{const r=await api(reg?'/register':'/login','POST',{name:reg?$('#an').value:undefined,email:$('#ae').value,password:$('#ap').value});
      S.user=r.user;await start()}catch(x){toast(x.message)}};
}

/* ---------- app shell ---------- */
function renderApp(){
  $('#app').innerHTML=`<div class="shell"><aside><div class="brand">queue<i>flow</i></div>
  <form id="nq"><input id="nqn" placeholder="New queue name" maxlength="40" required><button class="btn" aria-label="Create queue">+</button></form>
  <div id="ql"></div><div class="me"><span>${esc(S.user.name)}</span><button id="lo">Log out</button></div></aside><main id="main"></main></div>`;
  $('#nq').onsubmit=async e=>{e.preventDefault();
    try{const r=await api('/queues','POST',{name:$('#nqn').value});$('#nqn').value='';S.qid=r.id;S.tab='queue';paintMain()}catch(x){toast(x.message)}};
  $('#lo').onclick=async()=>{await api('/logout','POST');S.user=S.qid=null;renderAuth()};
}
function paintQueues(){
  $('#ql').innerHTML=S.queues.length?S.queues.map(q=>`<div class="qi ${q.id==S.qid?'on':''}" data-a="pick" data-id="${q.id}">
    <b>${esc(q.name)}</b><span class="pill">${q.waiting}</span><button class="del" data-a="delq" data-id="${q.id}" title="Delete queue">✕</button></div>`).join('')
    :'<p class="mut">No queues yet. Name one above to get started.</p>';
}
function paintMain(){
  const m=$('#main');
  if(!S.qid){m.innerHTML=`<div class="empty"><h2>Open your first queue</h2><p>Type a name in the sidebar, like “Front desk” or “Pharmacy”.</p></div>`;refresh();return}
  const q=S.queues.find(x=>x.id==S.qid);
  m.innerHTML=`<div class="head"><h1>${esc(q?q.name:'Queue')}</h1>
    <div class="tabs"><button data-a="tab" data-id="queue" class="${S.tab=='queue'?'on':''}">Queue</button><button data-a="tab" data-id="dash" class="${S.tab=='dash'?'on':''}">Dashboard</button></div></div>
    <form id="addf" style="${S.tab=='queue'?'':'display:none'}"><input id="pn" placeholder="Add a person and get their token" maxlength="60" required><button class="btn">Add to queue</button></form>
    <div id="view"></div>`;
  $('#addf').onsubmit=async e=>{e.preventDefault();
    try{const r=await api(`/queues/${S.qid}/tokens`,'POST',{name:$('#pn').value});$('#pn').value='';toast('Token '+r.code+' issued');await refresh()}catch(x){toast(x.message)}};
  S.data=S.an=null;refresh();
}

/* ---------- painting ---------- */
function paintView(){
  const v=$('#view');if(!v)return;
  if(S.tab=='queue'&&S.data){
    const d=S.data,top=d.waiting[0];
    v.innerHTML=`<div class="now"><div><div class="lbl">Now serving</div>
      ${d.serving.length?d.serving.map(t=>`<div class="srv"><b class="disp">${esc(t.code)}</b><span>${esc(t.name)}</span>
      <button class="btn sm blue" data-a="done" data-id="${t.id}">Mark done</button>
      <button class="ico x" data-a="cancel" data-id="${t.id}" title="Cancel token">✕</button></div>`).join(''):'<div class="srv"><span>Nobody at the counter</span></div>'}</div>
      <button class="btn big" data-a="serve" ${top?'':'disabled'}>Serve next<small>${top?esc(top.code)+' · '+esc(top.name):'queue is empty'}</small></button></div>
      <div class="kpis"><div><b>${d.waiting.length}</b>waiting</div><div><b>${d.stats.served}</b>called so far</div><div><b>${fmt(d.stats.avg_wait)}</b>average wait</div></div>
      <div class="sec"><h3>In line</h3></div>
      ${d.waiting.length?d.waiting.map((t,i)=>`<div class="tk"><div class="code disp">${esc(t.code)}</div>
        <div class="who"><b>${esc(t.name)}</b><span>${i==0?'Next up · ':'Position '+(i+1)+' · '}waiting <span class="wt" data-t="${t.created_at}">${fmt(d.now-t.created_at)}</span></span></div>
        <div class="act"><button class="ico" data-a="up" data-id="${t.id}" title="Move up" ${i==0?'disabled style="opacity:.3"':''}>▲</button>
        <button class="ico" data-a="down" data-id="${t.id}" title="Move down" ${i==d.waiting.length-1?'disabled style="opacity:.3"':''}>▼</button>
        <button class="ico x" data-a="cancel" data-id="${t.id}" title="Cancel token">✕</button></div></div>`).join('')
      :'<div class="empty" style="padding:40px"><p>The line is clear. Add someone above to issue a token.</p></div>'}`;
  }else if(S.tab=='dash'&&S.an){
    const a=S.an;
    v.innerHTML=`<div class="grid"><div class="k"><small>Average wait</small><b>${fmt(a.avg_wait)}</b></div>
      <div class="k"><small>Average service time</small><b>${fmt(a.avg_service)}</b></div>
      <div class="k"><small>Longest wait</small><b>${fmt(a.max_wait)}</b></div>
      <div class="k"><small>Served</small><b>${a.served}</b></div><div class="k"><small>Cancelled</small><b>${a.cancelled}</b></div>
      <div class="k"><small>Peak queue length</small><b>${a.peak}</b></div></div>
      <div class="chart"><h3>Queue length over time</h3><p class="mut">Every person added, served or cancelled moves the line.</p>${lineChart(a.trend)}</div>
      <div class="chart"><h3>How long recent people waited</h3><p class="mut">Last ${a.waits.length||12} tokens that reached the counter.</p>${barChart(a.waits)}</div>`;
  }
}
function lineChart(p){
  if(p.length<3)return '<p class="mut">Not enough activity yet. Add a few tokens and this fills in.</p>';
  const W=640,H=240,P=34,t0=p[0].ts,t1=p[p.length-1].ts,mx=Math.max(3,...p.map(x=>x.length));
  const X=t=>P+(t-t0)/Math.max(1,t1-t0)*(W-2*P),Y=v=>H-P-v/mx*(H-2*P);
  let d=`M${X(p[0].ts)},${Y(p[0].length)}`;for(let i=1;i<p.length;i++)d+=` H${X(p[i].ts)} V${Y(p[i].length)}`;
  const area=d+` V${H-P} H${X(t0)} Z`,tm=t=>new Date(t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  let g='';for(let i=0;i<=3;i++){const v=Math.round(mx*i/3);g+=`<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${P-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Queue length trend"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#2e6bff"/><stop offset=".55" stop-color="#ff2e93"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
  <linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff2e93" stop-opacity=".4"/><stop offset="1" stop-color="#2e6bff" stop-opacity="0"/></linearGradient></defs>
  ${g}<path d="${area}" fill="url(#ag)"/><path d="${d}" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="${P}" y="${H-8}">${tm(t0)}</text><text x="${W-P}" y="${H-8}" text-anchor="end">${tm(t1)}</text></svg>`;
}
function barChart(w){
  if(!w.length)return '<p class="mut">Serve someone from the queue to see wait times here.</p>';
  const W=640,H=240,P=34,mx=Math.max(1,...w.map(x=>x.wait)),bw=(W-2*P)/w.length;
  const bars=w.map((x,i)=>{const h=x.wait/mx*(H-2*P-18),bx=P+i*bw+bw*.18,y=H-P-h;
    return `<rect x="${bx}" y="${y}" width="${bw*.64}" height="${Math.max(h,3)}" rx="7" fill="url(#bg)"/>
    <text x="${bx+bw*.32}" y="${y-6}" text-anchor="middle">${fmt(x.wait)}</text><text x="${bx+bw*.32}" y="${H-12}" text-anchor="middle">${esc(x.code)}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recent wait times"><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff8a1f"/><stop offset=".5" stop-color="#ff2e93"/><stop offset="1" stop-color="#2e6bff"/></linearGradient></defs>${bars}</svg>`;
}

/* ---------- data ---------- */
async function refresh(){
  try{
    S.queues=(await api('/queues')).queues;
    if(S.qid&&!S.queues.find(q=>q.id==S.qid)){S.qid=null;paintQueues();paintMain();return}
    paintQueues();if(!S.qid)return;
    if(S.tab=='queue'){S.data=await api('/queues/'+S.qid);S.off=S.data.now-Date.now()/1000}
    else S.an=await api(`/queues/${S.qid}/analytics`);
    paintView();
  }catch(e){if(e.status==401){S.user=null;renderAuth()}else if(e.status!=404)toast(e.message)}
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  try{
    if(a=='pick'){S.qid=+id;S.tab='queue';paintMain();return}
    if(a=='tab'){S.tab=id;paintMain();return}
    if(a=='delq'){e.stopPropagation();if(!confirm('Delete this queue and all its history?'))return;await api('/queues/'+id,'DELETE');if(S.qid==id)S.qid=null;paintMain();return}
    if(a=='up'||a=='down')await api(`/tokens/${id}/move`,'POST',{dir:a});
    else if(a=='cancel'){if(!confirm('Cancel this token?'))return;await api(`/tokens/${id}/cancel`,'POST')}
    else if(a=='done')await api(`/tokens/${id}/complete`,'POST');
    else if(a=='serve')await api(`/queues/${S.qid}/serve`,'POST');
    await refresh();
  }catch(x){toast(x.message);refresh()}
});
setInterval(()=>{const n=Date.now()/1000+S.off;document.querySelectorAll('.wt').forEach(el=>el.textContent=fmt(n-el.dataset.t))},1000);
setInterval(()=>{if(S.user&&S.qid&&!document.hidden&&document.activeElement?.id!='pn')refresh()},5000);
async function start(){renderApp();await refresh();if(!S.qid&&S.queues.length)S.qid=S.queues[0].id;paintMain()}
(async()=>{try{S.user=(await api('/me')).user;await start()}catch{renderAuth()}})();
</script>
</body>
